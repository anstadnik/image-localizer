name: Build and test

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the package
        run: uv sync --python ${{ matrix.python-version }}
        shell: bash

      - name: Ruff check
        uses: astral-sh/ruff-action@v3

      - name: Ruff format check
        uses: astral-sh/ruff-action@v3
        with:
          args: "format --check"

      - name: Test types
        run: uv run --python ${{ matrix.python-version }} --with pyright pyright src/ *.py
